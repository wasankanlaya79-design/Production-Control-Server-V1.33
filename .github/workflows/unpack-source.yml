name: Unpack source archive

on:
  push:
    paths:
      - 'archive_parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and unpack source
        shell: bash
        run: |
          cat archive_parts/part*.b64 > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip
          cp -a Production_Control_Server_V1_33_CLEAN_LOGO_FIXED/. .
          rm -rf Production_Control_Server_V1_33_CLEAN_LOGO_FIXED source.b64 source.zip archive_parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import V1.33 clean source"
          git push
